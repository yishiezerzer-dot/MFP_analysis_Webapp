[project]
name = "mfp-mcp"
version = "0.1.0"
description = "Local MCP server for the MFP Analysis app automation API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
mfp-mcp = "mfp_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
